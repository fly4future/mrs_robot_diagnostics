robot_diagnostics:
  main_timer_rate: 1.0 # [Hz]
  error_publisher_rate: 2.0 # [Hz]
  state_timer_rate: 100.0 # [Hz]
  not_reporting_delay: 3.0 # [s]

  sensor_handlers:
    # the rate at which the sensor handlers will be updated, this is the rate at which the diagnostics will be published
    update_timer_rate: 1.0 # [Hz]
    # the list of sensors to monitor
    sensor_handler_names: [
      # Example sensor handlers
      "PX4",
      "Rangefinder",
      "GPS",
      "Magnetometer",
      "RemoteController",
      # "LidarHandler",
      # "IMUHandler",
      # "BatteryHandler",
      # "RangeFinderHandler",
    ]

    # ExampleHandler:
      # type: "Example" # Example, Autopilot, Camera, Lidar, IMU, GPS, Battery, Barometer, Magnetometer, RangeFinder
      # address: "mrs_robot_diagnostics/ExampleHandler"
      # topic: "example_node/topic" # Don't add the leading slash, the name will be resolved relative to the node's namespace 
      # message_type: "std_msgs/msg/String"
      # qos_reliability: "reliable"              # QoS reliability setting (default: "reliable")
      # expected_rate: 10.0                      # Hz
      # rate_tolerance: 0.3                      # 30% deviation allowed (default)

    # define "running" instances of plugins, there can be multiple instances of the same plugin
    CameraHandler:
      type: "Camera"
      address: "mrs_robot_diagnostics/CameraHandler"
      topic: "/servo_camera/"

    # Using generic handler 
    PX4:
       type: "Autopilot"
       address: "mrs_robot_diagnostics/GenericSensorHandler"
       topic: "hw_api/status"
       message_type: "mrs_msgs/msg/HwApiStatus"
       qos_reliability: "reliable"              # QoS reliability setting (default: "reliable")
       expected_rate: 100.0                     # Hz
       rate_tolerance: 0.3                      # 30% deviation allowed (default)

    Rangefinder:
       type: "Rangefinder"
       address: "mrs_robot_diagnostics/GenericSensorHandler"
       topic: "hw_api/distance_sensor"
       message_type: "sensor_msgs/msg/Range"
       qos_reliability: "reliable"
       expected_rate: 100.0
       rate_tolerance: 0.3

    GPS:
       type: "GPS"
       address: "mrs_robot_diagnostics/GPSHandler"
       topic: "hw_api/gnss"
       qos_reliability: "reliable"
       expected_rate: 50.0
       rate_tolerance: 0.3

    Magnetometer:
       type: "Magnetometer"
       address: "mrs_robot_diagnostics/MagnetometerHandler"
       topic: "hw_api/magnetic_field"
       qos_reliability: "reliable"
       expected_rate: 50.0
       rate_tolerance: 0.3

    RemoteController:
        type: "RemoteController"
        address: "mrs_robot_diagnostics/RCHandler"
        topic: "hw_api/rc_rssi"
        qos_reliability: "reliable"
        expected_rate: 10.0
        rate_tolerance: 0.3
